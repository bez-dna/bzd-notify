name: CI

on: pull_request

permissions: read-all

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --check

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: arduino/setup-protoc@v3
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test
